services:
  nginx:
    image: nginx:alpine
    container_name: kh_nginx
    depends_on:
      php:
        condition: service_started
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/var/www/frontend:ro
      - ./uploads:/var/www/uploads:ro
    networks:
      - kh_commerce_lab
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  php:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kh_php
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LAB_MODE: ${LAB_MODE:-1}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-kh_commerce}
      DB_USERNAME: ${DB_USERNAME:-kh}
      DB_PASSWORD: ${DB_PASSWORD:-kh_local_password}
      JWT_SECRET: ${JWT_SECRET:-khcommerce123}
      JWT_TTL: ${JWT_TTL:-3600}
      DEFAULT_BALANCE: ${DEFAULT_BALANCE:-1000000}
      TOPUP_MAINTENANCE: ${TOPUP_MAINTENANCE:-1}
      MIDTRANS_ENABLED: ${MIDTRANS_ENABLED:-0}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_SNAP_BASE_URL: ${MIDTRANS_SNAP_BASE_URL:-https://app.sandbox.midtrans.com}
      MIDTRANS_API_BASE_URL: ${MIDTRANS_API_BASE_URL:-https://api.sandbox.midtrans.com}
      MIDTRANS_SNAP_JS_URL: ${MIDTRANS_SNAP_JS_URL:-https://app.sandbox.midtrans.com/snap/snap.js}
      MIDTRANS_FINISH_URL: ${MIDTRANS_FINISH_URL:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-/var/www/uploads}
      OUTBOUND_ALLOW_LOCAL_LAB: ${OUTBOUND_ALLOW_LOCAL_LAB:-1}
    volumes:
      - ./uploads:/var/www/uploads
      - ./backend/src:/var/www/src:ro
      - ./backend/public:/var/www/public:ro
      - ./backend/templates:/var/www/templates:ro
    networks:
      - kh_commerce_lab
    healthcheck:
      test: ["CMD", "php", "-r", "$$f=@fsockopen('127.0.0.1',9000); exit($$f?0:1);"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: mariadb:11
    container_name: kh_db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-kh_root_local_password}
      MARIADB_DATABASE: ${DB_DATABASE:-kh_commerce}
      MARIADB_USER: ${DB_USERNAME:-kh}
      MARIADB_PASSWORD: ${DB_PASSWORD:-kh_local_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - kh_commerce_lab
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:

networks:
  kh_commerce_lab:
    driver: bridge
