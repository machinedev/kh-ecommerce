<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lupa Password - KH Commerce</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app-header"></div>
<main class="container">
    <div class="panel form-narrow">
        <h2 class="center">Lupa Password</h2>
        <form id="forgot-form">
            <div class="form-row">
                <label for="forgot-email">Email</label>
                <input type="email" id="forgot-email" required>
            </div>
            <button class="btn" type="submit" style="width:100%">Kirim Kode</button>
        </form>
        <form id="otp-form" hidden>
            <div class="form-row">
                <label for="otp-code">Kode verifikasi</label>
                <input type="text" id="otp-code" required>
            </div>
            <button class="btn" type="submit" style="width:100%">Verifikasi</button>
        </form>
        <form id="reset-form" hidden>
            <div class="form-row">
                <label for="reset-password">Password baru</label>
                <input type="password" id="reset-password" required>
            </div>
            <button class="btn" type="submit" style="width:100%">Simpan Password</button>
        </form>
        <p class="center" style="margin-top:14px"><a href="/login.html">Kembali ke halaman masuk</a></p>
    </div>
</main>
<footer class="container">KH Commerce - Ecommerce No.1 Seantero Bali</footer>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
<script>authPages.initForgot();</script>
</body>
</html>
